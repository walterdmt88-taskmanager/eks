apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress-api
  namespace: default
  # No rewrite-target — gateway mounts all routes under /api internally.
  # Stripping the prefix here broke auth middleware and left /health unrouted.
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress-frontend
  namespace: default
  # No rewrite-target here — assets, fonts, and SPA routes all pass through unchanged
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
