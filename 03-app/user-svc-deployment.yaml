apiVersion: v1
kind: Service
metadata:
  name: user-service      # K8s DNS: user-service:3001 — referenced in api-gw-cm USER_SERVICE_URL
  namespace: default
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: user-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: user-service
          image: 905418181527.dkr.ecr.eu-central-1.amazonaws.com/taskmanager-user-service:v1
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: user-svc-cm       # PORT, BCRYPT_ROUNDS, JWT_EXPIRES_IN
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-svc-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-svc-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
