# ============================================================
# Secrets Template — Task Manager
# ============================================================
#
# SETUP (one-time per environment):
#   1. cp eks/02-data/secrets-template.yaml eks/02-data/secrets.yaml
#   2. Fill in every <REPLACE_...> value
#   3. Never commit secrets.yaml — it is in .gitignore
#
# Values must be base64-encoded:
#   echo -n "mypassword" | base64
#
# Apply (managed by deploy.sh via kubectl apply -k eks/02-data/):
#   kubectl apply -k eks/02-data/
# ============================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: db-user-secret
  namespace: default
type: Opaque
data:
  POSTGRES_PASSWORD: <REPLACE_base64_password>   # echo -n "..." | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: db-task-secret
  namespace: default
type: Opaque
data:
  POSTGRES_PASSWORD: <REPLACE_base64_password>   # echo -n "..." | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: user-svc-secret
  namespace: default
type: Opaque
data:
  DATABASE_URL: <REPLACE_base64_url>             # postgresql://app_user:<password>@db-user:5432/users_db
  JWT_SECRET: <REPLACE_base64_jwt_secret>        # openssl rand -base64 32 | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: task-svc-secret
  namespace: default
type: Opaque
data:
  DATABASE_URL: <REPLACE_base64_url>             # postgresql://app_user:<password>@db-task:5432/tasks_db
  REDIS_URL: <REPLACE_base64_redis_url>          # redis://my-redis-master:6379

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gw-secret
  namespace: default
type: Opaque
data:
  JWT_SECRET: <REPLACE_base64_jwt_secret>        # same value as user-svc-secret JWT_SECRET

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: default
type: Opaque
data:
  REDIS_URL: <REPLACE_base64_redis_url>          # redis://my-redis-master:6379
  DISCORD_WEBHOOK_URL: <REPLACE_base64_webhook>  # https://discord.com/api/webhooks/...
