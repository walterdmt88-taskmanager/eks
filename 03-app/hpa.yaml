# HPA — Horizontal Pod Autoscaler for Task Manager backend services
#
# HPA formula: desiredReplicas = ceil(currentReplicas × currentMetric/targetMetric)
# Example: 2 pods at 80% CPU, target 60% → ceil(2 × 80/60) = ceil(2.67) = 3 pods
#
# Requires: metrics-server running in the cluster (kubectl top pods must work)
# Resource requests on pods are MANDATORY — HPA calculates % against the request value.
#
# Scale-up:   fast  — fires within 15s of breach (default HPA evaluation period)
# Scale-down: slow  — 5min stabilization window prevents thrashing after a spike

---
# api-gateway: handles all external traffic + JWT validation → first to feel load spikes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-api-gateway
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # % of the pod's CPU request (100m)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70   # % of the pod's memory request (128Mi)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down (prevents flapping)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # remove at most 1 pod per minute on scale-down
    scaleUp:
      stabilizationWindowSeconds: 0    # scale up immediately on breach
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # add at most 2 pods per minute on scale-up

---
# task-service: handles task CRUD — CPU-heavy on DB queries under load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-task-service
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
# user-service: handles auth (bcrypt is CPU-heavy on login) — fewer requests but expensive ops
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-user-service
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 4   # lower max — auth traffic is lower volume than task CRUD
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
