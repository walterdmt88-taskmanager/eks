apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress-api
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # rewrite-target ONLY applies to this ingress — strips /api prefix before forwarding
    # /api/users → /users, /api/tasks → /tasks
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress-frontend
  namespace: default
  # No rewrite-target here — assets, fonts, and SPA routes all pass through unchanged
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
