apiVersion: v1
kind: Service
metadata:
  name: frontend-service  # K8s DNS: frontend-service:3000 — Ingress backend for /
  namespace: default
spec:
  selector:
    app: frontend-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend-service
          image: 905418181527.dkr.ecr.eu-central-1.amazonaws.com/taskmanager-frontend:v2
          ports:
            - containerPort: 3000
          # No env vars — VITE_API_BASE_URL=/api baked at build; nginx proxies /api/ → api-gateway
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
